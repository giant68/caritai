<!DOCTYPE html>
<html lang="zh-CN" data-page="team" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团队 | 微爱未央 Caritai</title>
<meta name="description" content="微爱未央由学生团队（微爱之家）、导师团队（微爱帮帮团）、顾问团队（微爱之光）三支团队组成，微爱校友们也在世界各地持续支持微爱。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Team</span>
      <h1>微爱团队</h1>
      <p>微爱未央由三支团队组成：学生团队（微爱之家）、导师团队（微爱帮帮团）、顾问团队（微爱之光）。此外，从微爱毕业的校友们组成微爱校友网络，在世界各地持续关心和支持着微爱。微爱未央由学生团队自主运营，导师团队提供支持，顾问团队提供咨询。</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container" style="text-align:center;">
      <img src="assets/pages/team_1.jpg" alt="微爱未央组织架构" style="width:100%;max-width:860px;margin:0 auto;border-radius:6px;box-shadow:var(--shadow-sm);" onerror="this.onerror=null;this.style.display='none';">
    </div>
  </section>

  <!-- 微爱成员全球分布 -->
  <section class="section-tight">
    <div class="container" style="text-align:center;">
      <img src="assets/pages/team_2.png" alt="微爱成员全球分布图" style="width:100%;max-width:860px;margin:0 auto;border-radius:6px;box-shadow:var(--shadow-sm);" onerror="this.onerror=null;this.style.display='none';">
      <p style="margin-top:14px;color:var(--ink-soft);">跨越大洋的友谊，天各一方，心弦仍牵。</p>
    </div>
  </section>

  <div id="teamRoot"></div>
</main>

<footer class="site-footer" id="footer"></footer>

<div class="modal-overlay" id="memberModal" aria-hidden="true"></div>

<script src="js/team-data.js"></script>
